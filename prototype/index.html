<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HabitFlow · Phase 02I-A</title>
<style>
:root{font-family:system-ui,sans-serif;font-size:100%;color-scheme:light;--bg:#faf9fd;--surface:#fff;--ink:#24212a;--muted:#595365;--line:#cac4d0;--primary:#6250a4;--on:#fff;--soft:#e7deff}
:root[data-theme=dark]{color-scheme:dark;--bg:#141318;--surface:#201f25;--ink:#f6f1fa;--muted:#c7c0d0;--line:#79727f;--primary:#ccbeff;--on:#30205f;--soft:#493a7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
button{min-height:3rem;border-radius:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6rem .85rem}button.primary{background:var(--primary);color:var(--on);border-color:var(--primary)}button[aria-current=page]{background:var(--soft);font-weight:700}
header{background:#30205f;color:white;text-align:center;padding:.65rem;font-weight:700;font-size:.875rem}#app{display:grid;grid-template-columns:1fr;min-height:calc(100dvh - 2.5rem)}aside{display:none}main{padding:1.1rem;max-width:60rem;width:100%;margin:0 auto;padding-bottom:6rem}h1{font-size:1.7rem;line-height:1.25;margin:.2rem 0 1rem}h2{font-size:1.15rem}p{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:.7rem;flex-wrap:wrap}.stack{display:grid;gap:.8rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.8rem}.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;min-width:0}.item{display:flex;gap:.8rem;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:.75rem 0;flex-wrap:wrap}.item:last-child{border:0}.muted{color:var(--muted)}.small{font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:.6rem}.field{display:grid;gap:.3rem}.field input,.field select,.field textarea{width:100%;min-height:3rem;border:1px solid var(--line);border-radius:.65rem;padding:.65rem;background:var(--surface);color:var(--ink)}.field textarea{min-height:7rem}.error{color:#b3261e;font-weight:700}nav.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:.35rem;gap:.2rem}nav.bottom button{font-size:.75rem;padding:.4rem .15rem;min-width:0}#overlay:not(:empty){position:fixed;inset:0;background:#000a;display:flex;justify-content:center;align-items:flex-end;z-index:20}.dialog{background:var(--surface);border-radius:1.5rem 1.5rem 0 0;width:100%;max-width:34rem;padding:1.2rem;max-height:92dvh;overflow:auto}.directory{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:.4rem}.directory button{text-align:left}#status{position:fixed;bottom:5rem;right:1rem;max-width:min(28rem,90vw);background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:.8rem;z-index:25}#status:empty{display:none}
@media(min-width:600px){#app{grid-template-columns:13rem minmax(0,1fr)}aside{display:grid;align-content:start;gap:.5rem;padding:1rem;background:var(--surface);border-right:1px solid var(--line)}aside button{text-align:left}nav.bottom{display:none}main{padding:2rem}#overlay:not(:empty){align-items:center}.dialog{border-radius:1.5rem}#status{bottom:1rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<header>HABITFLOW DESIGN DEMO — Changes are temporary; no real account, backup, notifications or cloud sync</header>
<div id="app"><aside id="sidebar" aria-label="Sections"><strong>HabitFlow</strong><button data-go="S006">Today</button><button data-go="S018">Planner</button><button data-action="quick">Add</button><button data-go="S024">Goals</button><button data-go="S046">Insights</button><button data-go="S033">Finance</button><button data-go="S053">Settings</button><button data-go="directory">All 54 screens</button></aside><main id="view" tabindex="-1"></main></div>
<nav class="bottom" id="bottom" aria-label="Primary navigation"><button data-go="S006">Today</button><button data-go="S018">Planner</button><button data-action="quick">Add</button><button data-go="S024">Goals</button><button data-go="S046">Insights</button></nav><div id="overlay"></div><div id="status" role="status" aria-live="polite"></div>
<script>
"use strict";
const names=["Welcome","Privacy Choice","Permissions","Sign In","Account Linking","Today Dashboard","All Activities","Activity Details","Habit List","Habit Editor","Habit Details","Habit History","Task List","Task Editor","Task Details","Reminder List","Reminder Editor","Calendar","Weekly Planner","Project List","Project Editor","Project Details","Project Board","Goal List","Goal Editor","Goal Details","Milestone Editor","Journal Timeline","Journal Editor","Journal Details","Focus Timer","Focus History","Finance Overview","Financial Accounts","Transactions","Transaction Editor","Budgets","Budget Editor","Savings Goals","Wellness Overview","Mood Check-In","Wellness Log","Template Gallery","Template Preview","Template Customize","Insights Overview","Detailed Report","Weekly Review","Sync Center","Conflict Resolution","Data Export","Profile","Preferences","Accessibility"];
const ID=n=>"S"+String(n).padStart(3,"0"),N=s=>Number(s.slice(1)),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view=document.querySelector("#view"),overlay=document.querySelector("#overlay"),status=document.querySelector("#status"),app=document.querySelector("#app"),bottom=document.querySelector("#bottom");
const state={route:"S006",history:[],modal:null,returnModal:null,opener:null,dirty:false,form:{},formSnapshot:"",theme:false,large:false,selectedDate:13,pendingRoute:null,selection:{},editing:null};
const records={habits:[{title:"Read English for 20 minutes",done:true},{title:"Morning exercise",done:false}],tasks:[{title:"Prepare training materials",done:false}],reminders:[{title:"Review tomorrow's plan",done:false}],projects:[{title:"Website redesign",done:false}],goals:[{title:"Emergency fund",done:false}],journal:[{title:"Daily reflection",done:false}],wellness:[{title:"Water",done:false}],templates:[{title:"Morning routine",done:false}]};
const budgets=[{title:"Food",limit:500000}],savings=[{title:"Travel fund",target:2000000,current:400000}],milestones=[{title:"First module",done:false}],moods=[{title:"Calm",notes:"Feeling positive"}];
const accounts=[{id:"bank",name:"Bank",opening:5500000},{id:"cash",name:"Cash",opening:200000}];
let seq=4;
const postings=[{id:"seed-income",title:"Salary",date:"2026-11-13",type:"income",category:"Salary",amount:4000000,lines:[{account:"bank",delta:4000000},{account:"external",delta:-4000000}],status:"posted"},{id:"seed-expense",title:"Groceries",date:"2026-11-13",type:"expense",category:"Food",amount:125000,lines:[{account:"bank",delta:-125000},{account:"external",delta:125000}],status:"posted"}];
const money=n=>"₹"+(n/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const balance=id=>accounts.find(a=>a.id===id).opening+postings.filter(p=>p.status==="posted").flatMap(p=>p.lines).filter(l=>l.account===id).reduce((s,l)=>s+l.delta,0);
const total=()=>accounts.reduce((s,a)=>s+balance(a.id),0);
function parseMoney(v){if(!/^(?:0|[1-9]\d{0,9})(?:\.\d{1,2})?$/.test(String(v).trim()))return null;const [whole,frac=""]=String(v).split(".");const n=Number(whole)*100+Number(frac.padEnd(2,"0"));return Number.isSafeInteger(n)&&n>0?n:null}
function postTransaction(f){const amount=parseMoney(f.amount),type=f.type,from=f.from,to=f.to;if(!amount)return"Enter a positive amount with up to two decimal places.";if(!accounts.some(a=>a.id===from))return"Choose a valid account.";if(type==="transfer"&&(!accounts.some(a=>a.id===to)||from===to))return"Choose a different destination account.";if(!["income","expense","transfer"].includes(type))return"Choose a valid transaction type.";if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(f.date||"")||Number.isNaN(Date.parse(f.date+"T00:00:00Z")))return"Choose a valid date.";const lines=type==="transfer"?[{account:from,delta:-amount},{account:to,delta:amount}]:[{account:from,delta:type==="income"?amount:-amount},{account:"external",delta:type==="income"?-amount:amount}];if(lines.reduce((s,l)=>s+l.delta,0)!==0)throw Error("Unbalanced postings");postings.push({id:"demo-"+(++seq),title:f.title.trim()||(type==="transfer"?"Account transfer":type==="income"?"Income":"Expense"),date:f.date,type,category:f.category,amount,lines,status:"posted",simulated:true});return null}
const action=(label,act,primary=false)=>'<button '+(primary?'class="primary" ':'')+'data-action="'+act+'">'+safe(label)+'</button>';
const goButton=(label,id)=>'<button data-go="'+id+'">'+safe(label)+'</button>';
const section=(title,body)=>'<section class="card stack"><h2>'+safe(title)+'</h2>'+body+'</section>';
const entries=(key,target)=>section(key[0].toUpperCase()+key.slice(1),records[key].map((x,i)=>'<div class="item"><label><input type="checkbox" data-check="'+key+':'+i+'" '+(x.done?'checked':'')+'> '+safe(x.title)+'</label><button data-detail="'+key+':'+i+'" data-target="'+target+'">Details: '+safe(x.title)+'</button></div>').join("")||"<p>No sample records.</p>");
const forms={10:["Habit title","Category","Frequency","Reminder time"],14:["Task title","Priority","Due date","Notes"],17:["Reminder title","Date","Time","Repeat"],21:["Project title","Description","Due date"],25:["Goal title","Target","Deadline"],27:["Milestone title","Target","Due date"],29:["Journal title","Reflection"],38:["Budget name","Limit","Category"],41:["Mood","Notes"],42:["Wellness metric","Value","Date"],45:["Template name","Activity"],52:["Display name"]};
const parents={10:9,14:13,17:16,21:20,25:24,27:26,29:28,36:35,38:37,41:40,42:40,45:43,52:53};
const storage={10:"habits",14:"tasks",17:"reminders",21:"projects",25:"goals",27:"milestones",29:"journal",38:"budgets",41:"moods",42:"wellness",45:"templates"};
function formHtml(n){const labels=forms[n];if(n===36)return '<div class="stack"><label class="field">Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option></select></label><label class="field">Description<input name="title" placeholder="Example: Groceries"></label><label class="field">Amount (INR)<input name="amount" inputmode="decimal" placeholder="1250.00" required></label><label class="field">From / receiving account<select name="from"><option value="bank">Bank</option><option value="cash">Cash</option></select></label><label class="field">Destination account (transfer only)<select name="to"><option value="cash">Cash</option><option value="bank">Bank</option></select></label><label class="field">Category<select name="category"><option>Food</option><option>Salary</option><option>Bills</option><option>Transport</option><option>Other</option></select></label><label class="field">Date<input name="date" type="date" value="2026-11-13" required></label><label class="field">Recurrence<select name="repeat"><option>Never</option><option>Weekly (preview only)</option><option>Monthly (preview only)</option></select></label><label class="field">Notes<textarea name="notes"></textarea></label><p class="small muted">Posting is simulated. No bank, server or real recurring schedule is updated.</p></div>';
return '<div class="stack">'+labels.map((label,i)=>'<label class="field">'+safe(label)+(label==="Notes"||label==="Description"||label==="Reflection"?'<textarea name="f'+i+'"></textarea>':'<input name="f'+i+'" '+(i===0?'required ':'')+'placeholder="'+safe(label)+'">')+'</label>').join("")+'</div>'}
function navigate(dest){if(state.modal){requestClose();return}if(state.route===dest)return;if(guardEditor()){state.pendingRoute=dest;state.opener=document.activeElement;openModal("confirm","editor");return;}state.history.push(state.route);state.route=dest;state.dirty=false;render();view.focus()}
function back(){const dest=state.history[state.history.length-1]||"S006";if(guardEditor()){state.pendingRoute=dest;state.opener=document.activeElement;openModal("confirm","editor");return}if(state.history.length)state.history.pop();if(state.route!==dest){state.route=dest;render();view.focus()}}
function announce(s){status.textContent=s;clearTimeout(announce.t);announce.t=setTimeout(()=>status.textContent="",5500)}
function rows(key){return ({budgets,savings,milestones,moods})[key]||records[key]||[]}
function details(key,editor){const list=rows(key),index=state.selection[key]||0,r=list[index];if(!r)return section("No record",goButton("Return","S006"));return section(r.title,'<p>Sample record details — '+(r.done?"Complete":"Pending")+'.</p>'+Object.entries(r).filter(([k])=>!["title","done"].includes(k)).map(([k,v])=>"<p>"+safe(k)+": "+safe(v)+"</p>").join("")+'<div class="actions"><button data-edit="'+key+":"+index+":"+editor+'">Edit</button><button data-delete="'+key+":"+index+'">Delete</button></div>')}
function render(){document.documentElement.dataset.theme=state.theme?"dark":"light";document.documentElement.style.fontSize=state.large?"125%":"100%";document.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===state.route?"page":"false"));const n=N(state.route);let html='<div class="row"><div><div class="small muted">'+safe(state.route)+'</div><h1>'+safe(names[n-1]||"All 54 screens")+'</h1></div>'+goButton("All screens","directory")+'</div><div class="stack">';
if(state.route==="directory"){html='<h1>All 54 screens</h1><p>Canonical IDs; select any screen to inspect its controls.</p><div class="directory">'+names.map((s,i)=>goButton(ID(i+1)+" · "+s,ID(i+1))).join("")+'</div>'}
else if(forms[n]||n===36){html+=section("Edit "+names[n-1],'<form id="editor" class="stack">'+formHtml(n)+'<div class="actions"><button type="button" data-action="cancel-editor">Cancel</button><button class="primary" type="submit">Save sample</button></div><p class="small muted">Changes exist only in this browser session.</p></form>')}
else if(n<=5){html+=section("Start using HabitFlow","<p>Local mode works without sign-in. Permissions and cloud linking are optional. Authentication is not implemented.</p>"+goButton("Continue",n===5?"S006":ID(n+1))+goButton("Skip to Today","S006"))}
else if(n===6||n===7){const all=[...records.habits,...records.tasks],done=all.filter(x=>x.done).length;html+=section("Today's progress",'<strong>'+done+' of '+all.length+' complete</strong><p>Visual summary; no sound required.</p><div class="actions">'+goButton("Habits","S009")+goButton("Tasks","S013")+goButton("Finance","S033")+goButton("Wellness","S040")+'</div>')+entries("habits","S011")+entries("tasks","S015")}
else if(n===9){html+=entries("habits","S011")+goButton("Create habit","S010")}else if(n===11){html+=details("habits",10)+goButton("Habit history","S012")}else if(n===12){html+=section("Habit history",records.habits.map(x=>"<p>"+safe(x.title)+" — "+(x.done?"Complete":"Pending")+"</p>").join(""))}
else if(n===13){html+=entries("tasks","S015")+goButton("Create task","S014")}else if(n===15){html+=details("tasks",14)}
else if(n===16){html+=entries("reminders","S017")+goButton("New reminder","S017")}
else if([18,19].includes(n)){html+=section("November 2026",'<label class="field">Selected day<input id="day" type="number" min="1" max="30" value="'+state.selectedDate+'"></label><p>Sample agenda for day '+state.selectedDate+'.</p>')+entries("tasks","S015")}
else if(n===20){html+=entries("projects","S022")+goButton("New project","S021")}else if(n===22){html+=details("projects",21)+goButton("Project board","S023")}else if(n===23){html+=section("Project board",records.tasks.map((x,i)=>'<div class="item"><span>'+safe(x.title)+' — '+(x.done?"Done":"To do")+'</span><button data-toggle="tasks:'+i+'">Move to '+(x.done?"To do":"Done")+'</button></div>').join(""))}
else if(n===24){html+=entries("goals","S026")+goButton("New goal","S025")}else if(n===26){html+=details("goals",25)+section("Milestones",milestones.map(x=>"<p>"+safe(x.title)+"</p>").join(""))+goButton("New milestone","S027")}
else if(n===28){html+=entries("journal","S030")+goButton("New journal entry","S029")}else if(n===30){html+=details("journal",29)}
else if(n===31||n===32){html+=section("Focus timer",'<strong>25:00</strong><p>Static timer preview: no background clock is running.</p>'+action("Preview start state","timer"))}
else if(n===33||n===34||n===35){html+=section("Account balances",accounts.map(a=>'<div class="item"><strong>'+safe(a.name)+'</strong><span>'+money(balance(a.id))+'</span></div>').join("")+'<div class="item"><strong>Combined</strong><strong>'+money(total())+'</strong></div>')+section("Posted sample ledger",postings.map(p=>'<div class="item"><span>'+safe(p.title)+' <small class="muted">'+safe(p.type)+' · '+safe(p.date)+' · simulated posted</small></span><span>'+money(p.amount)+'</span></div>').join(""))+'<div class="actions">'+goButton("New transaction","S036")+goButton("Budgets","S037")+goButton("Savings","S039")+'</div>'}
else if(n===37){html+=section("Budgets",budgets.map((b,i)=>'<div class="item"><span>'+safe(b.title)+' — '+money(b.limit)+'</span><button data-edit="budgets:'+i+':38">Edit</button></div>').join("")+goButton("New budget","S038"))}else if(n===39){html+=section("Savings goals",savings.map((g,i)=>'<div class="item"><span>'+safe(g.title)+' — '+money(g.current)+' / '+money(g.target)+'</span><button data-savings="'+i+'">Add sample ₹100</button></div>').join(""))}
else if(n===40){html+=entries("wellness","S040")+section("Mood history",moods.map(m=>"<p>"+safe(m.title)+" — "+safe(m.notes)+"</p>").join(""))+section("Wellness",'<p>Visual check-ins, no audio required.</p>'+goButton("Mood check-in","S041")+goButton("Wellness log","S042"))}
else if(n===43){html+=entries("templates","S044")+goButton("Customize template","S045")}else if(n===44){html+=details("templates",45)+goButton("Customize template","S045")}
else if([46,47,48].includes(n)){html+=section("Weekly activity report",'<p>Sample completion: Monday 50%, Tuesday 70%, Wednesday 80%, Thursday 60%, Friday 90%, Saturday 85%, Sunday 97%.</p>'+goButton("Weekly review","S048"))}
else if(n===49||n===50||n===51){html+=section("Cloud and privacy",'<p>No real Firebase connection. Sync, conflicts and export are simulated only.</p><div class="actions">'+action("Preview sync","sync")+goButton("Conflict preview","S050")+action("Preview export","export")+'</div>')}
else if(n===53||n===54){html+=section("Accessibility and appearance",'<label class="item">Dark theme <input type="checkbox" data-setting="theme" '+(state.theme?'checked':'')+'></label><label class="item">Larger text <input type="checkbox" data-setting="large" '+(state.large?'checked':'')+'></label><p>Visual notifications and optional vibration are design requirements, not active OS features.</p>'+goButton("Accessibility","S054"))}
else{html+=section(names[n-1],'<p>This screen is a design preview. Production actions, detailed states and device behavior still need implementation and testing.</p><div class="actions">'+goButton("Today","S006")+goButton("All screens","directory")+'</div>')}
if(state.route!=="directory")html+='</div><div class="actions" style="margin-top:1rem">'+action("Back","back")+'</div>';view.innerHTML=html}
function isolate(on){app.inert=on;bottom.inert=on;if(on){app.setAttribute("aria-hidden","true");bottom.setAttribute("aria-hidden","true")}else{app.removeAttribute("aria-hidden");bottom.removeAttribute("aria-hidden")}}
function openModal(kind,returnModal=null){state.opener=state.opener||document.activeElement;state.modal=kind;state.returnModal=returnModal;drawModal()}
function drawModal(){isolate(true);const confirm=state.modal==="confirm";const quick=state.modal==="quick";overlay.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title" tabindex="-1">'+(confirm?"Discard unsaved changes?":quick?"Quick Add":"Unsaved form")+'</h2>'+(confirm?'<p>Keep editing, or discard the changes?</p><div class="actions">'+action("Continue editing","continue")+action("Discard changes","discard",true)+'</div>':quick?'<div class="actions">'+[["Habit",10],["Task",14],["Reminder",17],["Goal",25],["Transaction",36],["Journal",29]].map(x=>goButton(x[0],ID(x[1]))).join("")+'</div>'+action("Close","close"):'<p>Your form has unsaved changes.</p>'+action("Close","close"))+'</div>';overlay.querySelector("#dialog-title").focus()}
function cleanup(){state.modal=null;state.returnModal=null;overlay.innerHTML="";isolate(false);const o=state.opener;state.opener=null;if(o?.isConnected)o.focus();else view.focus()}
function requestClose(){if(state.modal==="confirm"){if(state.returnModal==="editor"){cleanup();view.querySelector("input,textarea,select")?.focus()}else{state.modal=state.returnModal||"quick";drawModal()}return}if(state.dirty){state.returnModal=state.modal;state.modal="confirm";drawModal()}else cleanup()}
function guardEditor(){const form=view.querySelector("#editor");return !!(form&&state.dirty)}
function cancelEditor(){if(guardEditor()){state.pendingRoute=state.history[state.history.length-1]||"S006";state.opener=document.activeElement;openModal("confirm","editor");return}back()}
function collect(form){return Object.fromEntries(new FormData(form))}
function submitEditor(form){const n=N(state.route),f=collect(form),title=String(f.f0||"").trim();if(n===36){const err=postTransaction(f);if(err){announce(err);return}}else{if(!title){announce("Enter the required title.");return}if(storage[n]){const key=storage[n],list=rows(key),row={title,done:false};if(n===38){const amount=parseMoney(f.f1);if(!amount){announce("Enter a valid positive budget limit.");return}row.limit=amount}else if(n===41){row.notes=f.f1||""}else{(forms[n]||[]).slice(1).forEach((label,i)=>{row[label.toLowerCase().replaceAll(" ","_")]=f["f"+(i+1)]||""})}if(state.editing?.key===key&&list[state.editing.index])list[state.editing.index]=row;else list.push(row);state.editing=null}else announce("Preview form only: this screen does not save records.")}state.dirty=false;state.editing=null;state.pendingRoute=null;announce("Sample saved in temporary memory only.");navigate(ID(parents[n]||6))}
document.addEventListener("click",e=>{const detailButton=e.target.closest("[data-detail]");if(detailButton){const [key,i]=detailButton.dataset.detail.split(":");state.selection[key]=Number(i);navigate(detailButton.dataset.target);return}
const edit=e.target.closest("[data-edit]");if(edit){const [key,i,n]=edit.dataset.edit.split(":");state.editing={key,index:Number(i)};navigate(ID(Number(n)));const row=rows(key)[Number(i)],form=view.querySelector("#editor");if(row&&form){form.querySelector("[name=f0]").value=row.title;const vals=Object.entries(row).filter(([k])=>!["title","done"].includes(k));vals.forEach(([k,v],j)=>{const input=form.querySelector('[name="f'+(j+1)+'"]');if(input)input.value=v})}return}
const del=e.target.closest("[data-delete]");if(del){const [key,i]=del.dataset.delete.split(":");if(window.confirm("Delete this temporary sample record?")){rows(key).splice(Number(i),1);state.selection[key]=0;announce("Sample deleted.");navigate(({habits:"S009",tasks:"S013",projects:"S020",goals:"S024",journal:"S028",templates:"S043"})[key]||"S006")}return}
const toggle=e.target.closest("[data-toggle]");if(toggle){const [key,i]=toggle.dataset.toggle.split(":");rows(key)[Number(i)].done=!rows(key)[Number(i)].done;render();announce("Sample board status changed.");return}
const save=e.target.closest("[data-savings]");if(save){savings[Number(save.dataset.savings)].current+=10000;render();announce("Added ₹100 to temporary savings example.");return}
const go=e.target.closest("[data-go]");if(go){if(state.modal==="quick"){const dest=go.dataset.go;cleanup();navigate(dest)}else if(!state.modal)navigate(go.dataset.go);return}const a=e.target.closest("[data-action]");if(!a)return;switch(a.dataset.action){case"quick":openModal("quick");break;case"close":requestClose();break;case"continue":if(state.returnModal==="editor"){cleanup();view.querySelector("input,textarea,select")?.focus()}else{state.modal=state.returnModal||"quick";drawModal()}break;case"discard":{const wasEditor=state.returnModal==="editor";state.dirty=false;state.editing=null;cleanup();if(wasEditor){const dest=state.pendingRoute;state.pendingRoute=null;if(dest&&dest!==state.route)navigate(dest);else back()}announce("Changes discarded. Background interaction restored.");break}case"cancel-editor":cancelEditor();break;case"back":if(guardEditor())cancelEditor();else back();break;case"timer":announce("Timer preview only. No clock started.");break;case"sync":announce("Demo only: no cloud connection.");break;case"export":announce("Demo only: no file exported.");break}});
document.addEventListener("input",e=>{if(e.target.closest("#editor"))state.dirty=true;if(e.target.id==="day"){state.selectedDate=Math.min(30,Math.max(1,Number(e.target.value)||1))}});
document.addEventListener("change",e=>{const s=e.target.dataset.setting;if(s){state[s]=e.target.checked;render();announce("Display preference changed for this demo only.")}const c=e.target.dataset.check;if(c){const [key,index]=c.split(":");records[key][Number(index)].done=e.target.checked;render();announce("Sample activity updated.")}});
document.addEventListener("submit",e=>{if(e.target.id==="editor"){e.preventDefault();submitEditor(e.target)}});
document.addEventListener("keydown",e=>{if(!state.modal)return;if(e.key==="Escape"){e.preventDefault();requestClose();return}if(e.key!=="Tab")return;const els=[...overlay.querySelectorAll("button,input,select,textarea,[tabindex='0']")].filter(x=>!x.disabled&&x.getClientRects().length);if(!els.length){e.preventDefault();return}const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){e.preventDefault();first.focus()}});
render();
</script></body></html>
