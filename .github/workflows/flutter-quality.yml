name: Flutter quality checks

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-quality.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-quality.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format source for analysis
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze
      - name: Widget and unit tests
        if: success() || failure()
        run: flutter test

  android-debug-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Android debug build
        run: flutter build apk --debug
